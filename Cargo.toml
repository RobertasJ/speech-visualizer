[package]
name = "speech-visualizer"
version = "0.1.0"
edition = "2024"

[features]
default = []                   # CPU; enable `cuda` or `vulkan` for GPU
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
cpal = "0.18"
dotenv = "0.15.0"
freya = "=0.5.0-rc.9"
futures-channel = "0.3"
futures-lite = "2.6"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
rig-core = { version = "0.44", features = ["reqwest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53.2", features = ["full"] }
whisper-rs = "0.16"

# Dev builds everywhere except whisper.cpp
[profile.dev.package.whisper-rs-sys]
opt-level = 3
debug = false
debug-assertions = false

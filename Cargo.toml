[package]
name = "speech-visualizer"
version = "0.1.0"
edition = "2024"

[features]
default = []                   # CPU; enable `cuda` or `vulkan` for GPU
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
cpal = "0.18"
freya = "=0.5.0-rc.9"
futures-channel = "0.3.34"
futures-lite = "2.6.1"
thiserror = "2.0.21"
whisper-rs = "0.16"

# Dev builds everywhere except whisper.cpp
[profile.dev.package.whisper-rs-sys]
opt-level = 3
debug = false
debug-assertions = false
